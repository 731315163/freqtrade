[build-system]
requires = ["setuptools >= 64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freqtrade"
dynamic = ["version"]

authors = [
  {name = "Freqtrade Team"},
  {name = "Freqtrade Team", email = "freqtrade@protonmail.com"},
]

description = "Freqtrade - Crypto Trading Bot"
readme = "README.md"
requires-python = ">=3.12"

license = {text = "GPLv3"}
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
  # from requirements.txt
  "ccxt==4.4.91",
  "sqlalchemy==2.0.41",
  "python-telegram-bot==22.2",
  "humanize==4.12.3",
  "cachetools==6.1.0",
  "requests==2.32.4",
  "httpx>=0.24.1",
  "urllib3==2.5.0",
  "jsonschema==4.24.0",
  "numpy==2.2.6",
  "pandas==2.3.0",
  "ta-lib==0.5.5",
  "ft-pandas-ta==0.3.15",
  "technical==1.5.1",
  "tabulate==0.9.0",
  "pycoingecko==3.2.0",
  "python-rapidjson==1.20",
  "orjson==3.10.18",
  "jinja2==3.1.6",
  "questionary==2.1.0",
  "prompt-toolkit==3.0.51",
  "joblib==1.5.1",
  "rich==14.0.0",
  "pyarrow==20.0.0 ; platform_machine != 'armv7l'",
  "fastapi==0.115.14",
  "pydantic==2.11.7",
  "pyjwt==2.10.1",
  "websockets==15.0.1",
  "uvicorn==0.35.0",
  "psutil==7.0.0",
  "schedule==1.2.2",
  "janus==2.0.0",
  "ast-comments==1.2.3",
  "aiofiles==24.1.0",
  "aiohttp==3.12.13",
